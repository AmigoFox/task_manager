{% extends "base.html" %}
{% load bootstrap4 %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-3">Удаление задачи</h1>
        <div class="alert alert-danger">Удалить задачу «{{ task.title }}»?</div>
        <form method="post">
            {% csrf_token %}
            {% bootstrap_button button_type="submit" button_class="btn-danger" content="Удалить" %}
            <a class="btn btn-secondary ml-2" href="{% url 'tasks:tasks_list' %}">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="jumbotron">
    <h1 class="display-4">Task Manager</h1>
    <p class="lead">Планируйте задачи, следите за сроками и приоритетами.</p>
    <hr class="my-4">
    {% if user.is_authenticated %}
        <a class="btn btn-primary btn-lg" href="{% url 'tasks:tasks_list' %}">Мои задачи</a>
    {% else %}
        <a class="btn btn-primary btn-lg" href="{% url 'users:register' %}">Регистрация</a>
        <a class="btn btn-outline-secondary btn-lg ml-2" href="{% url 'users:login' %}">Войти</a>
    {% endif %}
</div>
{% endblock %}

{% load bootstrap4 %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Task Manager</title>
    {% bootstrap_css %}
    {% bootstrap_javascript jquery='full' %}
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'tasks:index' %}">Task Manager</a>
        <div class="navbar-nav ml-auto flex-row align-items-center">
            {% if user.is_authenticated %}
                <span class="navbar-text mr-3">{{ user.username }}</span>
                <a class="nav-link" href="{% url 'tasks:tasks_list' %}">Мои задачи</a>
                <form action="{% url 'users:logout' %}" method="post" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link nav-link p-0 ml-3 text-white">Выйти</button>
                </form>
            {% else %}
                <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                <a class="nav-link ml-2" href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container">
    {% bootstrap_messages %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
